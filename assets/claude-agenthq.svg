<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Claude Agent HQ: góc văn phòng isometric (bảng Kanban, TV token, sàn gỗ) + robot agent chibi -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34405c"/>
      <stop offset="1" stop-color="#151a27"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4d6dc"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0956f"/>
      <stop offset="1" stop-color="#c9643f"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a33"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
    <clipPath id="headClip"><ellipse cx="256" cy="262" rx="80" ry="64"/></clipPath>
  </defs>

  <!-- nền -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <!-- tường trái: ốp chân màu ngọc + phần trên kem -->
    <polygon points="92,318 256,236 256,86 92,168" fill="#e2dccf"/>
    <polygon points="92,318 256,236 256,190 92,272" fill="#3f9e94"/>
    <polygon points="92,272 256,190 256,184 92,266" fill="#fbfaf7"/>
    <!-- tường phải -->
    <polygon points="256,236 420,318 420,168 256,86" fill="#f1ece2"/>
    <polygon points="256,236 420,318 420,272 256,190" fill="#4fb3a9"/>
    <polygon points="256,190 420,272 420,266 256,184" fill="#ffffff"/>
    <!-- đèn hắt trên tường -->
    <polygon points="98,176 250,100 250,106 98,182" fill="#ffd9a0" opacity="0.9"/>
    <polygon points="262,100 414,176 414,182 262,106" fill="#ffd9a0" opacity="0.9"/>

    <!-- bảng Kanban trên tường trái: (u dọc tường, v chiều cao) -->
    <g transform="matrix(164 -82 0 -1 92 318)">
      <rect x="0.12" y="92" width="0.76" height="64" fill="#fbfaf6"/>
      <rect x="0.15" y="146" width="0.16" height="6" fill="#e8c548"/>
      <rect x="0.33" y="146" width="0.16" height="6" fill="#5fd38a"/>
      <rect x="0.51" y="146" width="0.16" height="6" fill="#ff7a45"/>
      <rect x="0.69" y="146" width="0.16" height="6" fill="#6f9bd8"/>
      <rect x="0.15" y="124" width="0.16" height="16" fill="#f6e3a0"/>
      <rect x="0.15" y="104" width="0.16" height="16" fill="#f6e3a0"/>
      <rect x="0.33" y="124" width="0.16" height="16" fill="#b9ecc9"/>
      <rect x="0.51" y="124" width="0.16" height="16" fill="#ffc6ad"/>
      <rect x="0.69" y="124" width="0.16" height="16" fill="#c4d6f0"/>
      <rect x="0.69" y="104" width="0.16" height="16" fill="#c4d6f0"/>
    </g>
    <!-- TV token trên tường phải -->
    <g transform="matrix(164 82 0 -1 256 236)">
      <rect x="0.14" y="90" width="0.72" height="68" fill="#0f1218"/>
      <rect x="0.2" y="98" width="0.07" height="14" fill="#5f7fb0"/>
      <rect x="0.3" y="98" width="0.07" height="22" fill="#5f7fb0"/>
      <rect x="0.4" y="98" width="0.07" height="18" fill="#5f7fb0"/>
      <rect x="0.5" y="98" width="0.07" height="32" fill="#5f7fb0"/>
      <rect x="0.6" y="98" width="0.07" height="26" fill="#5f7fb0"/>
      <rect x="0.7" y="98" width="0.07" height="44" fill="#5fd38a"/>
    </g>

    <!-- sàn gỗ: (u theo cạnh phải, w theo cạnh trái) -->
    <polygon points="256,236 420,318 256,400 92,318" fill="#c79d73"/>
    <g transform="matrix(164 82 -164 82 256 236)">
      <rect x="0" y="0.0" width="1" height="0.12" fill="#d3ab82"/>
      <rect x="0" y="0.25" width="1" height="0.12" fill="#cba27a"/>
      <rect x="0" y="0.5" width="1" height="0.12" fill="#d6b089"/>
      <rect x="0" y="0.75" width="1" height="0.12" fill="#c69c71"/>
    </g>
    <!-- thảm tròn -->
    <ellipse cx="256" cy="352" rx="118" ry="44" fill="#3f9e94" opacity="0.55"/>
    <ellipse cx="256" cy="352" rx="96" ry="34" fill="#7ccdc3" opacity="0.6"/>
    <!-- cây góc -->
    <ellipse cx="404" cy="292" rx="20" ry="7" fill="#000" opacity="0.18"/>
    <rect x="394" y="270" width="20" height="22" rx="4" fill="#ece6da"/>
    <circle cx="404" cy="252" r="22" fill="#4f9a56"/>
    <circle cx="413" cy="240" r="15" fill="#67b56d"/>
  </g>

  <!-- robot agent -->
  <ellipse cx="256" cy="402" rx="66" ry="13" fill="#000" opacity="0.32" filter="url(#soft)"/>
  <!-- tay -->
  <ellipse cx="196" cy="350" rx="15" ry="26" transform="rotate(20 196 350)" fill="url(#shell)"/>
  <circle cx="186" cy="374" r="14" fill="url(#cap)"/>
  <ellipse cx="318" cy="318" rx="15" ry="26" transform="rotate(-150 318 318)" fill="url(#shell)"/>
  <circle cx="332" cy="292" r="14" fill="url(#cap)"/>
  <!-- thân -->
  <ellipse cx="256" cy="352" rx="52" ry="46" fill="url(#shell)"/>
  <path d="M205,350 Q256,366 307,350 L306,362 Q256,378 206,362 Z" fill="url(#cap)"/>
  <rect x="236" y="320" width="40" height="24" rx="6" fill="#101216"/>
  <rect x="243" y="327" width="26" height="10" rx="3" fill="#5fd38a" filter="url(#glow)"/>
  <!-- tai nghe -->
  <ellipse cx="174" cy="264" rx="13" ry="24" fill="url(#cap)"/>
  <ellipse cx="338" cy="264" rx="13" ry="24" fill="url(#cap)"/>
  <!-- đầu -->
  <ellipse cx="256" cy="262" rx="80" ry="64" fill="url(#shell)"/>
  <g clip-path="url(#headClip)">
    <ellipse cx="256" cy="196" rx="70" ry="38" fill="url(#cap)"/>
  </g>
  <ellipse cx="236" cy="226" rx="26" ry="9" fill="#ffffff" opacity="0.55"/>
  <!-- kính mặt + mắt sáng + má hồng -->
  <rect x="194" y="246" width="124" height="54" rx="27" fill="url(#visor)"/>
  <rect x="222" y="259" width="18" height="26" rx="9" fill="#9dffc4" filter="url(#glow)"/>
  <rect x="272" y="259" width="18" height="26" rx="9" fill="#9dffc4" filter="url(#glow)"/>
  <ellipse cx="200" cy="300" rx="12" ry="6" fill="#ff8fa3" opacity="0.85"/>
  <ellipse cx="312" cy="300" rx="12" ry="6" fill="#ff8fa3" opacity="0.85"/>
  <!-- ăng-ten + đèn trạng thái -->
  <rect x="253" y="176" width="6" height="26" rx="3" fill="#8a8f99"/>
  <circle cx="256" cy="172" r="12" fill="#5fd38a" filter="url(#glow)"/>

  <!-- bong bóng thoại: ba trạng thái việc -->
  <g>
    <path d="M330,118 h108 a22,22 0 0 1 22,22 v18 a22,22 0 0 1 -22,22 h-74 l-20,18 l2,-18 h-16 a22,22 0 0 1 -22,-22 v-18 a22,22 0 0 1 22,-22 z" fill="#f7f6f2"/>
    <circle cx="350" cy="149" r="9" fill="#5fd38a"/>
    <circle cx="384" cy="149" r="9" fill="#e8c548"/>
    <circle cx="418" cy="149" r="9" fill="#ff7a45"/>
  </g>

  <!-- viền + ánh sáng trên -->
  <rect x="16" y="16" width="480" height="240" rx="108" fill="url(#hl)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#000" stroke-opacity="0.25"/>
</svg>
