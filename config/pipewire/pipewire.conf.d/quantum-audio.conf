# Quantum audio: hai sink ảo để chọn trong menu âm thanh (cần gói swh-plugins).
#
#   "Boost"  - tăng +6 dB rồi qua limiter (giới hạn -1 dB) nên không vỡ tiếng.
#              Limiter dùng chung cho hai kênh nên không làm lệch trái/phải.
#   "Mono"   - trộn L+R thành một tín hiệu, phát giống hệt ở hai tai (cũng có boost + limiter),
#              dùng khi một bên tai nghe/tai nghe kém hơn bên kia.
#
# Đầu ra của filter đi tới sink thật (tai nghe Bluetooth hoặc loa) theo ưu tiên của WirePlumber;
# WirePlumber không nối các node cùng node.link-group với nhau, nên chọn Boost/Mono làm mặc định vẫn an toàn.
# Để tối đa: đặt tai nghe ở 100% một lần (pavucontrol), rồi chỉnh âm lượng bằng sink Boost/Mono.

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Boost (+6 dB, limiter)"
            # chung một link-group: WirePlumber không nối Boost/Mono vào nhau, luôn ra thiết bị thật
            node.link-group  = "quantum-audio"
            media.name       = "Boost (+6 dB, limiter)"
            filter.graph = {
                nodes = [
                    {
                        type    = ladspa
                        name    = lim
                        plugin  = fast_lookahead_limiter_1913
                        label   = fastLookaheadLimiter
                        control = {
                            "Input gain (dB)"  = 6.0
                            "Limit (dB)"       = -1.0
                            "Release time (s)" = 0.08
                        }
                    }
                ]
                inputs  = [ "lim:Input 1" "lim:Input 2" ]
                outputs = [ "lim:Output 1" "lim:Output 2" ]
            }
            capture.props = {
                node.name        = "quantum_boost"
                media.class      = "Audio/Sink"
                audio.position   = [ FL FR ]
                priority.session = 100
                priority.driver  = 100
            }
            playback.props = {
                node.name      = "quantum_boost.output"
                audio.position = [ FL FR ]
                node.passive   = true
            }
        }
    }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Mono (L+R, boost)"
            # chung một link-group: WirePlumber không nối Boost/Mono vào nhau, luôn ra thiết bị thật
            node.link-group  = "quantum-audio"
            media.name       = "Mono (L+R, boost)"
            filter.graph = {
                nodes = [
                    {
                        type    = builtin
                        name    = mix
                        label   = mixer
                        control = { "Gain 1" = 0.5  "Gain 2" = 0.5 }
                    }
                    {
                        type    = ladspa
                        name    = lim
                        plugin  = fast_lookahead_limiter_1913
                        label   = fastLookaheadLimiter
                        control = {
                            "Input gain (dB)"  = 6.0
                            "Limit (dB)"       = -1.0
                            "Release time (s)" = 0.08
                        }
                    }
                ]
                links = [
                    { output = "mix:Out" input = "lim:Input 1" }
                    { output = "mix:Out" input = "lim:Input 2" }
                ]
                inputs  = [ "mix:In 1" "mix:In 2" ]
                outputs = [ "lim:Output 1" "lim:Output 2" ]
            }
            capture.props = {
                node.name        = "quantum_mono"
                media.class      = "Audio/Sink"
                audio.position   = [ FL FR ]
                priority.session = 90
                priority.driver  = 90
            }
            playback.props = {
                node.name      = "quantum_mono.output"
                audio.position = [ FL FR ]
                node.passive   = true
            }
        }
    }
]
